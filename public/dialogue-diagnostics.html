<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>有间 · 对话与成长记录</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/dialogue-diagnostics.css"><script type="module" src="/dialogue-diagnostics.js"></script></head>
<body><main class="diagnostics"><header><div><a href="/">← 回到有间</a><h1>对话与成长记录</h1><p>核对谁说过什么、回复依据和角色逐渐形成的想法。</p></div><div class="controls"><button id="refresh" class="small-button">刷新记录</button><a class="small-button" href="/api/session/export" download>导出完整记录</a><button id="index" class="small-button" hidden>更新语义索引</button><button id="fork" class="small-button">创建隔离分支</button></div></header>
<p id="status" role="status" aria-live="polite">正在读取…</p><section id="branch" class="settings-card" hidden><h2>隔离分支已创建</h2><p>分支保存独立的历史、记忆、关系、感受和日记，自动联系与提醒派送已关闭。</p><p>在项目目录运行以下命令，打开命令返回的本地网址即可回放：</p><pre id="branch-command"></pre></section>
<div id="summary" class="metrics"></div><div class="columns"><section class="settings-card"><h2>谁说过什么</h2><p id="history-notice" class="fine-print"></p><label>查找这次历史窗口<input id="history-filter" type="search" placeholder="输入一句原话或主题"></label><div id="history"></div></section>
<div><section class="settings-card"><div class="controls"><h2>角色成长与日记</h2><button id="reflect" class="small-button">整理一次反思</button></div><p class="fine-print">初步倾向保留为探索中的想法。多个独立表达支持后，才记为稳定倾向。每条记录都附有实际原话出处。</p><div id="growth"></div></section><section class="settings-card"><h2>当前感受与未完话题</h2><div id="dynamics"></div></section><section class="settings-card"><h2>结构化记忆</h2><div id="memories"></div></section></div></div>
<section class="settings-card"><h2>按日压缩的核心记录</h2><p id="compression-status" class="fine-print"></p><div id="compression"></div></section>
<section class="settings-card"><h2>最近回复的依据</h2><p class="fine-print">选择一轮，查看历史版本、召回、工具回执、模型提示与修订，以及服务商报告的用量。未提供用量时显示未知。</p><label>选择一轮<select id="trace-select"></select></label><div id="trace"></div></section></main></body></html>
